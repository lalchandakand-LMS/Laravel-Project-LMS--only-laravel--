name: Laravel CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP 8.3 · Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo, openssl, bcmath, gd
          coverage: none
          tools: composer:v2

      - name: Validate safe update scripts
        run: bash -n update.sh backup.sh tests/scripts/backup-safety-test.sh

      - name: Test backup privacy and secret handling
        run: bash tests/scripts/backup-safety-test.sh

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache
          touch database/database.sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
      - name: Upload production frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: vite-production-build
          path: public/build/
          if-no-files-found: error
          retention-days: 14

      - name: Run test suite
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test
  mysql:
    name: MySQL 8.0 · migrations and feature tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aloms_lms_test
          MYSQL_USER: lms
          MYSQL_PASSWORD: lms-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, fileinfo, openssl, bcmath, gd
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache

      - name: Apply all migrations on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: lms
          DB_PASSWORD: lms-test-password
        run: php artisan migrate --force

      - name: Run full test suite on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aloms_lms_test
          DB_USERNAME: lms
          DB_PASSWORD: lms-test-password
        run: php artisan test

  deploy-package:
    name: Build cPanel production package
    runs-on: ubuntu-latest
    needs: [tests, mysql]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, fileinfo, openssl, bcmath, gd
          coverage: none
          tools: composer:v2

      - name: Prepare private build environment
        run: cp .env.example .env

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build production frontend
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Assemble clean cPanel package
        run: |
          rm -f .env
          mkdir -p package
          rsync -a ./ package/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='database/*.sqlite' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='public/storage'
          mkdir -p package/storage/framework/cache/data package/storage/framework/sessions package/storage/framework/views package/storage/logs package/storage/app/public package/bootstrap/cache
          printf '%s\\n' "$GITHUB_SHA" > package/RELEASE_COMMIT.txt
          (cd package && zip -qr ../aloms-lms-cpanel-package.zip .)
          unzip -t aloms-lms-cpanel-package.zip
          test -f package/vendor/autoload.php
          test -f package/public/build/manifest.json

      - name: Upload complete cPanel production package
        uses: actions/upload-artifact@v4
        with:
          name: aloms-lms-cpanel-package
          path: aloms-lms-cpanel-package.zip
          if-no-files-found: error
          retention-days: 14
