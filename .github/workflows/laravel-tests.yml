name: Laravel tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, branding/aloms-english-center]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, fileinfo, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml
          coverage: none

      - name: Validate safe update scripts
        run: bash -n update.sh backup.sh tests/scripts/backup-safety-test.sh

      - name: Test backup privacy and secret handling
        run: bash tests/scripts/backup-safety-test.sh

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/app/public bootstrap/cache

      - name: Run test suite
        run: php artisan test --display-all-issues

      - name: Diagnose the remaining PHPUnit risky test
        run: vendor/bin/phpunit --display-all-issues --debug --filter 'test_public_blog_only_lists_published_posts_and_instructors_cannot_manage_posts'
